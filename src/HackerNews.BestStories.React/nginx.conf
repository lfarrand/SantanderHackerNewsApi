# React UI front door on the compose network.
# /api is proxied to the API service. Blazor is NOT behind this proxy
# (it listens on host 8082 and talks to api:8080 itself).
#
# proxy_pass has no URI path so /api/best-stories?n=20 is forwarded intact.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Docker embedded DNS so `api` is re-resolved if the API container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cold loads hydrate all candidates; allow the API's default 120s deadline to return.
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 125s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
    }

    location = /health {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream/health;
    }

    location /swagger {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
    }

    location /openapi/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri $uri/ /index.html;
    }
}

services:
  api:
    image: ${HN_SMOKE_PROJECT}-api:smoke
    container_name: ${HN_SMOKE_PROJECT}-api
    ports: !override
      - "127.0.0.1::8080"
    environment:
      HackerNews__BaseUrl: http://upstream:8080/v0/
      HackerNews__RequestTimeoutSeconds: "10"
      HackerNews__RefreshTimeoutSeconds: "120"
    depends_on:
      upstream:
        condition: service_healthy
    restart: "no"

  web:
    image: ${HN_SMOKE_PROJECT}-web:smoke
    container_name: ${HN_SMOKE_PROJECT}-web
    ports: !override
      - "127.0.0.1::80"
    restart: "no"

  blazor:
    image: ${HN_SMOKE_PROJECT}-blazor:smoke
    container_name: ${HN_SMOKE_PROJECT}-blazor
    ports: !override
      - "127.0.0.1::8080"
    environment:
      ApiClient__RequestTimeoutSeconds: "130"
      ApiClient__RefreshTimeoutSeconds: "120"
    restart: "no"

  upstream:
    image: python:3.12.13-bookworm
    container_name: ${HN_SMOKE_PROJECT}-upstream
    command: [python, -B, -u, /smoke/fixture.py]
    volumes:
      - ./tests/smoke:/smoke:ro
    networks:
      - hn-backend
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 10
    restart: "no"

networks:
  hn-backend:
    internal: false